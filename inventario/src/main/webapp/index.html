<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Inventario — Login</title>
        <link rel="stylesheet" href="css/login.css" />
    </head>
    <body>


        <div class="scanline"></div>

        <div class="login-container">


            <div class="login-logo">
                <div class="login-logo-icon">

                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <polyline points="21 8 21 21 3 21 3 8"/>
                    <rect x="1" y="3" width="22" height="5"/>
                    <line x1="10" y1="12" x2="14" y2="12"/>
                    </svg>
                </div>
                <h1>Inventario</h1>
                <p>Sistema de Gestión de Inventarios</p>
                <p class="brand">Fundación Universitaria Compensar</p>
            </div>


            <div class="form-group">
                <label>Usuario</label>
                <input type="text" id="usuario" placeholder="Ingresa tu usuario" autocomplete="username" />
                <span class="input-line"></span>
            </div>


            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="password" placeholder="Ingresa tu contraseña" autocomplete="current-password" />
                <span class="input-line"></span>
            </div>


            <button class="btn-login" onclick="iniciarSesion()">Iniciar Sesión</button>


            <div class="credenciales">
                <p class="credenciales-titulo">Credenciales de acceso</p>
                <div class="credencial-item">
                    <span class="credencial-label">Usuario</span>
                    <span class="credencial-valor">admin</span>
                </div>
                <div class="credencial-item">
                    <span class="credencial-label">Contraseña</span>
                    <span class="credencial-valor">admin</span>
                </div>
            </div>


            <p class="error-msg" id="errorMsg">Usuario o contraseña incorrectos</p>

        </div>

        <script src="js/auth.js"></script>
    </body>
</html>
